<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solar Panel Condition Monitoring</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Solar Panel Condition Monitoring</h1>
  </header>

  <main>
    <section class="panel-status">
      <div class="panel">
        <h2>Panel 1</h2>
        <p>Status: <span id="status1">Loading...</span></p>
        <p>Voltage: <span id="voltage1">-- V</span></p>
        <p>Temperature: <span id="temp1">-- °C</span></p>
      </div>

      <div class="panel">
        <h2>Panel 2</h2>
        <p>Status: <span id="status2">Loading...</span></p>
        <p>Voltage: <span id="voltage2">-- V</span></p>
        <p>Temperature: <span id="temp2">-- °C</span></p>
      </div>
    </section>

    <button onclick="refreshData()">Refresh Data</button>
  </main>

  <footer>
    <p>&copy; 2025 Solar Monitoring System</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
